name: Phase 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/setup_env.py
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck
        working-directory: frontend
      - name: Build and start the real Compose stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Tests against migrated PostgreSQL
        run: docker compose exec -T backend sh -c 'TEST_DATABASE_URL="$DATABASE_URL" pytest -q'
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        working-directory: frontend
      - name: Migration rollback and reapply on disposable CI data
        run: |
          docker compose run --rm migrate alembic downgrade base
          docker compose run --rm migrate alembic upgrade head
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Cleanup
        if: always()
        run: docker compose down -v
