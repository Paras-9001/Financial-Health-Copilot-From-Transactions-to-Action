services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-financial_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_env.py first}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://fhc_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-financial_copilot}
      MIGRATION_DATABASE_URL: postgresql+psycopg://fhc_owner:${MIGRATION_DB_PASSWORD}@db:5432/${POSTGRES_DB:-financial_copilot}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://fhc_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-financial_copilot}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
